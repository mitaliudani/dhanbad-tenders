name: Update Dhanbad bids

on:
  schedule:
    # Every hour at 23 minutes past. GitHub sometimes starts a run late or skips one,
    # so hourly keeps the list fresh; a run that finds nothing new changes no files.
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-bids
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet beautifulsoup4==4.12.3

      - name: Read the alert emails and update docs/bids.json
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scraper/mail.py

      - name: Save the new list
        run: |
          git config user.name "tender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bids.json docs/status.json data/mail_state.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update bids $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet || true
            git push
          fi
