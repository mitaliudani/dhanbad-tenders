name: Update Dhanbad bids

on:
  # Paused: Tender247 refuses GitHub's servers (HTTP 403) and Tenderlelo's terms do not allow
  # automated crawlers, so this does not run on a timer. It can still be started by hand.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-bids
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet requests==2.32.3 beautifulsoup4==4.12.3

      - name: Read the listings and update docs/bids.json
        run: python scraper/update.py

      - name: Save the new list
        run: |
          git config user.name "tender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bids.json docs/status.json data/seen.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update bids $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet || true
            git push
          fi

      - name: Keep sample pages for fixing the reader
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-pages
          path: debug/
          retention-days: 5
          if-no-files-found: ignore
