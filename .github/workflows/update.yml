name: Update Dhanbad bids

on:
  schedule:
    # Every 3 hours, at 23 minutes past (UTC). GitHub may start it a few minutes late.
    - cron: "23 */3 * * *"
    # Also 8:37 AM and 6:37 PM India time, soon after the Claude refresh emails its data.
    - cron: "7 3,13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-bids
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet beautifulsoup4==4.12.3

      - name: Read the alert emails and update docs/bids.json
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scraper/mail.py

      - name: Save the new list
        run: |
          git config user.name "tender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bids.json docs/status.json data/mail_state.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update bids $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet || true
            git push
          fi
