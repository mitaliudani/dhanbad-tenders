name: Telegram bot

on:
  schedule:
    # Every 10 minutes: answers /check, /list, /start and /stop, and sends alerts.
    # GitHub may start a run a few minutes late.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-bids
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet beautifulsoup4==4.12.3

      - name: Answer Telegram messages and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scraper/telegram.py

      - name: Save
        run: |
          git config user.name "tender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Telegram bot $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet || true
            git push
          fi
